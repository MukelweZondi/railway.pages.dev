<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 40px 20px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website!</h1>
        <p>This is my very first website.</p>
    </header>

    <main>
        <h2>About Me</h2>

        <p>I am learning how to create websites using GitHub.</p>

        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </main>

    <footer>
        <p>© 2026 My First Website</p>
    </footer>

</body>
</html>
